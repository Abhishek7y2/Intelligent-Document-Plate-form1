name: docunexa_mobile
description: "DocuNexa Document Intelligence Mobile Client"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.7
  equatable: ^2.0.5

  # Networking & Serialization
  dio: ^5.4.0
  intl: ^0.19.0

  # Navigation & Routing
  go_router: ^14.0.0

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8

  # Document Intake & Scanning
  file_picker: ^8.0.0
  cunning_document_scanner: ^1.4.0

  # UI & Design System
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.3
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
