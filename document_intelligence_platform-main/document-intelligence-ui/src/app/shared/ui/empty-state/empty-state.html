<div class="empty-state" [ngClass]="'variant-' + variant">
  <div class="empty-icon">
    <span>{{ resolvedIcon }}</span>
  </div>

  <div class="empty-content">
    <h3>{{ resolvedTitle }}</h3>
    <p>{{ resolvedMessage }}</p>
  </div>

  @if (actionLabel) {
    <button type="button" class="empty-action" (click)="onAction()">
      {{ actionLabel }}
    </button>
  }
</div>
