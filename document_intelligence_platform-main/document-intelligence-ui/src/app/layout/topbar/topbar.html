<header class="topbar">

  <!-- LEFT -->
  <div class="topbar-left">

    <!-- Sidebar Toggle Button (Dock/Undock / Drawer toggle) -->
    <button
      type="button"
      class="sidebar-toggle-btn"
      (click)="toggleSidebar()"
      [title]="uiState.sidebarOpen() && uiState.sidebarPinned() ? 'Collapse sidebar' : 'Expand sidebar'"
      [attr.aria-label]="uiState.sidebarOpen() && uiState.sidebarPinned() ? 'Collapse sidebar' : 'Expand sidebar'"
    >
      <svg class="toggle-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Interactive DocNexa Logo Trigger (Visible when sidebar is collapsed / unpinned) -->
    @if (!uiState.sidebarPinned()) {
      <button
        type="button"
        class="docnexa-logo-trigger"
        (mouseenter)="onLogoHover()"
        (mouseleave)="onLogoLeave()"
        (click)="onLogoClick()"
        aria-label="Toggle DocNexa Slidebar Navigation"
        title="Hover or click to show DocNexa slidebar panel"
      >
        <div class="logo-trigger-icon">
          <img src="/docnexa-icon-transparent.png" alt="DocNexa" class="logo-img">
        </div>
        <div class="logo-trigger-text">
          <strong class="logo-brand-name">DocNexa</strong>
          <span class="logo-trigger-chevron">Menu ▾</span>
        </div>
      </button>

      <div class="topbar-sep"></div>
    }

    <div class="breadcrumb">
      <div class="breadcrumb-text">
        <span>Workspace</span>
        <b>/</b>
        <strong>Document Intelligence</strong>
      </div>
    </div>

  </div>


  <!-- RIGHT -->
  <div class="topbar-right">

    <!-- Search -->
    <button
      type="button"
      class="topbar-icon-button"
      aria-label="Search"
    >
      <span class="search-icon"></span>
    </button>


    <!-- Notifications -->
    <button
      type="button"
      class="topbar-icon-button notification-button"
      [attr.aria-label]="'Notifications, ' + notificationService.unreadCount() + ' unread'"
      (click)="toggleNotifications()"
    >
      <span class="notification-icon">🔔</span>
      @if (notificationService.unreadCount() > 0) {
        <span class="notification-dot-badge">{{ notificationService.unreadCount() }}</span>
      }
    </button>


    <!-- Divider -->
    <div class="topbar-divider"></div>


    <!-- Organization -->
    <div class="organization-info">

      <span class="organization-label">
        ORGANIZATION
      </span>

      <strong>
        {{ currentUser?.organization || 'Acme Corporation' }}
      </strong>

    </div>


    <!-- User -->
    <div class="user-profile" (click)="navigateToProfile()" style="cursor: pointer;" title="View My Profile">

      <div class="avatar">
        {{ currentUser?.name ? currentUser!.name.charAt(0) : 'O' }}
      </div>

      <div class="user-info">

        <strong>
          {{ currentUser?.name || 'User' }}
        </strong>

        <span>
          {{ currentUser?.role || 'User' }}
        </span>

      </div>

      <span class="profile-chevron">
       ⌄
      </span>

    </div>


    <!-- Logout -->
    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      <span class="logout-icon">↪</span>
      <span>Logout</span>
    </button>

  </div>

</header>
