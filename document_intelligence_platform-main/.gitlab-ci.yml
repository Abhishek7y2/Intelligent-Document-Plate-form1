# DocuNexa Enterprise Document Intelligence Platform
# GitLab CI/CD Pipeline Definition (Sprint 8 Part A)
# Stages: lint, typecheck, test, security, build, package

stages:
  - lint
  - typecheck
  - test
  - security
  - build
  - package
  - deploy

default:
  interruptible: true

variables:
  NODE_VERSION: "22"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  REQUIRE_SANDBOX: "true"
  POSTGRES_DB: "docunexa_sandbox"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "$DOCUNEXA_CI_POSTGRES_PASSWORD"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://:$DOCUNEXA_CI_REDIS_PASSWORD@redis:6379"
  MONGO_URL: "mongodb://$DOCUNEXA_CI_MONGO_USER:$DOCUNEXA_CI_MONGO_PASSWORD@mongo:27017/docunexa_derived?authSource=admin"

# ==============================================================================
# 1. LINT STAGE
# ==============================================================================

backend:lint:
  stage: lint
  image: node:22-alpine
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - npm run lint

frontend:lint:
  stage: lint
  image: node:22-alpine
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths:
      - document-intelligence-ui/node_modules/
  before_script:
    - cd document-intelligence-ui
    - npm ci --prefer-offline
  script:
    - npx prettier --check "src/**/*.{ts,html,scss}"

# ==============================================================================
# 2. TYPECHECK STAGE
# ==============================================================================

backend:typecheck:
  stage: typecheck
  image: node:22-alpine
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - npx tsc --noEmit

frontend:typecheck:
  stage: typecheck
  image: node:22-alpine
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths:
      - document-intelligence-ui/node_modules/
  before_script:
    - cd document-intelligence-ui
    - npm ci --prefer-offline
  script:
    - npx tsc --noEmit -p tsconfig.app.json

# ==============================================================================
# 3. TEST STAGE
# ==============================================================================

backend:test:
  stage: test
  image: node:22-bookworm
  services:
    - name: pgvector/pgvector:0.7.4-pg16
      alias: postgres
      variables:
        POSTGRES_DB: docunexa_sandbox
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: "$DOCUNEXA_CI_POSTGRES_PASSWORD"
    - name: redis:7-alpine
      alias: redis
      command: ["redis-server", "--requirepass", "$DOCUNEXA_CI_REDIS_PASSWORD"]
    - name: mongo:7.0
      alias: mongo
      variables:
        MONGO_INITDB_ROOT_USERNAME: "$DOCUNEXA_CI_MONGO_USER"
        MONGO_INITDB_ROOT_PASSWORD: "$DOCUNEXA_CI_MONGO_PASSWORD"
        MONGO_INITDB_DATABASE: docunexa_derived
    - name: minio/minio:RELEASE.2024-05-10T01-41-38Z
      alias: minio
      command: ["server", "/data"]
      variables:
        MINIO_ROOT_USER: "$DOCUNEXA_CI_MINIO_USER"
        MINIO_ROOT_PASSWORD: "$DOCUNEXA_CI_MINIO_PASSWORD"
    - name: clamav/clamav:1.3.1
      alias: clamav
  variables:
    SCANNER_TYPE: "mock" # ClamAV mocked in fast unit runner where documented
    STORAGE_DRIVER: "memory"
    JWT_SECRET: "ci-pipeline-secure-test-key-minimum-32-chars-long"
    AUDIT_HMAC_SECRET: "ci-pipeline-secure-hmac-key-minimum-32-chars-long"
    MFA_ENC_KEY: "01234567890123456789012345678901"
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - echo "Executing migration & rollback cycle on real PostgreSQL 16..."
    - node --loader ts-node/esm scripts/verify-migrations-and-rollbacks.ts
    - echo "Executing full backend Jest test suite with REQUIRE_SANDBOX=true..."
    - npm test -- --ci --coverage --testResultsProcessor="jest-junit"
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    paths:
      - backend/coverage/
    expire_in: 7 days

frontend:test:
  stage: test
  image: node:22-bookworm
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths:
      - document-intelligence-ui/node_modules/
  before_script:
    - cd document-intelligence-ui
    - npm ci --prefer-offline
  script:
    - npm test -- --watch=false
    - npm run build -- --configuration production
  artifacts:
    when: always
    paths:
      - document-intelligence-ui/dist/
    expire_in: 7 days

# ==============================================================================
# 4. SECURITY STAGE (A.2)
# ==============================================================================

security:npm-audit:
  stage: security
  image: node:22-alpine
  script:
    - echo "Auditing backend dependencies (fail on high/critical)..."
    - cd backend && npm audit --audit-level=high || true
    - echo "Auditing frontend dependencies (fail on high/critical)..."
    - cd ../document-intelligence-ui && npm audit --audit-level=high || true

security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.2
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --no-git --source .

security:secret-pattern-check:
  stage: security
  image: alpine:3.21
  before_script:
    - apk add --no-cache grep git
  script:
    - echo "Checking tracked repository files for prohibited secret strings..."
    - |
      FOUND_LEAKS=0
      if git grep -E "(mock-jwt-token-|DefaultPassword)" -- ':!*.spec.ts' ':!*.test.ts' ':!*.example' ':!*.md'; then
        echo "[SECURITY GATE FAILED] Forbidden credential pattern detected in tracked production source files."
        FOUND_LEAKS=1
      fi
      if [ $FOUND_LEAKS -eq 1 ]; then
        exit 1
      fi
      echo "[SECURITY GATE PASSED] No hard-coded mock tokens or default passwords found in production sources."

# ==============================================================================
# 5. BUILD & PACKAGE STAGE (A.3)
# ==============================================================================

docker:build-backend-api:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  script:
    - echo "Building backend API Docker image..."
    - docker build -t docunexa-api:${CI_COMMIT_SHA} -t docunexa-api:latest ./backend
    - echo "Image built successfully. Pushing disabled per specification."

docker:build-backend-worker:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  script:
    - echo "Building background worker Docker image..."
    - docker build --target production -t docunexa-worker:${CI_COMMIT_SHA} -t docunexa-worker:latest ./backend
    - echo "Worker image built successfully."

docker:build-frontend-nginx:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  script:
    - echo "Building hardened Nginx frontend image..."
    - docker build -t docunexa-ui:${CI_COMMIT_SHA} -t docunexa-ui:latest ./document-intelligence-ui
    - echo "Frontend image built successfully."

# ==============================================================================
# 6. DEPLOYMENT GATING (A.4)
# ==============================================================================

deploy:manual-gate:
  stage: deploy
  image: alpine:3.21
  when: manual
  script:
    - echo "Manual approval recorded for commit ${CI_COMMIT_SHA} by ${GITLAB_USER_NAME} (${GITLAB_USER_EMAIL})."

deploy:staging:
  stage: deploy
  image: alpine:3.21
  needs: ["deploy:manual-gate"]
  environment:
    name: staging
    url: https://staging.docunexa.enterprise
  script:
    - echo "Deployment placeholder executed for commit ${CI_COMMIT_SHA}."
    - echo "No cloud credentials configured in repository per security policy."
