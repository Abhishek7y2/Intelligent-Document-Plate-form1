version: '3.8'

services:
  postgres-sandbox:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: docunexa-postgres-16-sandbox
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${SANDBOX_POSTGRES_PASSWORD:?Set SANDBOX_POSTGRES_PASSWORD}"
      POSTGRES_DB: docunexa_sandbox
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_sandbox:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docunexa_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-sandbox:
    image: redis:7-alpine
    container_name: docunexa-redis-sandbox
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${SANDBOX_REDIS_PASSWORD:?Set SANDBOX_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SANDBOX_REDIS_PASSWORD:?Set SANDBOX_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo-sandbox:
    image: mongo:7.0
    container_name: docunexa-mongo-sandbox
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: docunexa_admin
      MONGO_INITDB_ROOT_PASSWORD: "${SANDBOX_MONGO_PASSWORD:?Set SANDBOX_MONGO_PASSWORD}"
      MONGO_INITDB_DATABASE: docunexa_derived
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata_sandbox:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-sandbox:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docunexa-minio-sandbox
    restart: always
    environment:
      MINIO_ROOT_USER: "${SANDBOX_MINIO_USER:?Set SANDBOX_MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${SANDBOX_MINIO_PASSWORD:?Set SANDBOX_MINIO_PASSWORD}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata_sandbox:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav-sandbox:
    image: clamav/clamav:1.3.1
    container_name: docunexa-clamav-sandbox
    restart: always
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan /bin/sh || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdata_sandbox:
  mongodata_sandbox:
  miniodata_sandbox:
