name: DocuNexa Mobile Continuous Integration & Release (Flutter)

on:
  push:
    branches: [ main, develop, mobile-frontend ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, develop, mobile-frontend ]
    paths:
      - 'mobile/**'

jobs:
  flutter-ci:
    name: Flutter Mobile CI & Build (Analyze, 230 Tests & Release AAB)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (v3.22.x)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:version:'

      - name: Verify Flutter & Dart Installation
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze --fatal-infos

      - name: Run Full Automated Test Suite (230 Authored Tests)
        run: flutter test --coverage

      - name: Generate Code Coverage Summary
        run: |
          if command -v lcov &> /dev/null; then
            lcov --summary coverage/lcov.info
          else
            echo "lcov not installed; coverage info generated at coverage/lcov.info"
          fi

      - name: Build Android Release Application Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-report
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload Release Bundle (AAB) Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docunexa-release-bundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
